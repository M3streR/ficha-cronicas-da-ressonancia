name: Harden Chronicle sharing

on:
  push:
    branches:
      - chronicles-sharing-foundation
    paths:
      - .github/workflows/chronicles-sharing-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chronicles-sharing-foundation

      - name: Harden conversion and invite completion states
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('js/chronicles-sharing.js')
          text = path.read_text(encoding='utf-8')

          old = """    convert.hidden = online;\n    convert.disabled = !chronicle || operationPending;\n    convert.textContent = authenticated ? 'Tornar Crônica Online' : 'Entrar para tornar Online';\n\n    invite.hidden = !online || !owner;\n"""
          new = """    const mappedOnlineId = !online && chronicle ? getConvertedOnlineId(chronicle.id) : '';\n    convert.hidden = online;\n    convert.disabled = !chronicle || operationPending || Boolean(mappedOnlineId);\n    convert.textContent = mappedOnlineId\n      ? 'Versão Online Criada'\n      : (authenticated ? 'Tornar Crônica Online' : 'Entrar para tornar Online');\n    convert.title = mappedOnlineId ? 'Esta Crônica local já possui uma versão online vinculada neste navegador.' : '';\n\n    invite.hidden = !online || !owner;\n"""
          if old not in text:
            raise SystemExit('syncActionButtons anchor missing')
          text = text.replace(old, new, 1)

          old = """    note.className = 'chronicle-sharing-note';\n    note.innerHTML = '<strong>A versão local será preservada.</strong><span>Nada será apagado deste navegador. A versão online será um novo registro compartilhável.</span>';\n"""
          new = """    note.className = 'chronicle-sharing-note';\n    note.innerHTML = '<strong>A versão local será preservada.</strong><span>Nada será apagado deste navegador. A versão online será um novo registro compartilhável.</span><span>Nesta etapa, somente nome, sinopse e tipo são levados para o online. Capa, Elenco, Participantes, Confrontos e Escudo permanecem na versão local até serem integrados.</span>';\n"""
          if old not in text:
            raise SystemExit('conversion note anchor missing')
          text = text.replace(old, new, 1)

          old = """  async function renderIncomingInviteDialog(code, message = '', kind = '') {\n"""
          new = """  async function renderIncomingInviteDialog(code, message = '', kind = '', completedOnlineId = '') {\n"""
          if old not in text:
            raise SystemExit('incoming invite signature anchor missing')
          text = text.replace(old, new, 1)

          old = """    intro.textContent = authenticated\n      ? 'Você recebeu acesso a uma Crônica compartilhada. Aceite o convite para adicioná-la à sua conta.'\n      : 'Você recebeu acesso a uma Crônica compartilhada. Entre na sua conta para continuar; o convite será preservado.';\n\n    const note = document.createElement('div');\n"""
          new = """    intro.textContent = completedOnlineId\n      ? 'O convite foi aceito e a Crônica já faz parte da sua conta.'\n      : (authenticated\n        ? 'Você recebeu acesso a uma Crônica compartilhada. Aceite o convite para adicioná-la à sua conta.'\n        : 'Você recebeu acesso a uma Crônica compartilhada. Entre na sua conta para continuar; o convite será preservado.');\n\n    const note = document.createElement('div');\n"""
          if old not in text:
            raise SystemExit('incoming invite intro anchor missing')
          text = text.replace(old, new, 1)

          old = """    note.className = 'chronicle-sharing-note';\n    note.innerHTML = '<strong>Convite individual</strong><span>Este link pode ser utilizado apenas uma vez e ficará associado à conta que o aceitar.</span>';\n"""
          new = """    note.className = 'chronicle-sharing-note';\n    note.innerHTML = completedOnlineId\n      ? '<strong>Acesso confirmado</strong><span>Esta conta agora é participante da Crônica compartilhada.</span>'\n      : '<strong>Convite individual</strong><span>Este link pode ser utilizado apenas uma vez e ficará associado à conta que o aceitar.</span>';\n"""
          if old not in text:
            raise SystemExit('incoming invite note anchor missing')
          text = text.replace(old, new, 1)

          marker = """    const actions = document.createElement('div');\n    actions.className = 'chronicle-sharing-actions';\n    const later = document.createElement('button');\n"""
          replacement = """    const actions = document.createElement('div');\n    actions.className = 'chronicle-sharing-actions';\n\n    if (completedOnlineId) {\n      const close = document.createElement('button');\n      close.type = 'button';\n      close.className = 'btn secondary';\n      close.textContent = 'Fechar';\n      close.addEventListener('click', closeDialog);\n\n      const view = document.createElement('button');\n      view.type = 'button';\n      view.className = 'btn';\n      view.textContent = 'Ver Crônicas';\n      view.addEventListener('click', async () => {\n        if (inviteDialog.open) inviteDialog.close();\n        if (typeof global.showChroniclesIndex === 'function') {\n          await global.showChroniclesIndex({ focusId: completedOnlineId });\n        } else if (typeof global.renderChroniclesIndex === 'function') {\n          await global.renderChroniclesIndex({ focusId: completedOnlineId });\n        }\n      });\n      actions.append(close, view);\n      inviteShell.append(intro, note, feedback, actions);\n      return;\n    }\n\n    const later = document.createElement('button');\n"""
          if marker not in text:
            raise SystemExit('incoming invite actions anchor missing')
          text = text.replace(marker, replacement, 1)

          old = """        await renderIncomingInviteDialog('Convite aceito. A Crônica já está vinculada à sua conta.', 'success');\n        global.showNotification?.('Você entrou na Crônica online.');\n        if (typeof global.showChroniclesIndex === 'function') {\n          await global.showChroniclesIndex({ focusId: onlineId });\n        } else if (typeof global.renderChroniclesIndex === 'function') {\n          await global.renderChroniclesIndex({ focusId: onlineId });\n        }\n"""
          new = """        await renderIncomingInviteDialog(code, 'Convite aceito. A Crônica já está vinculada à sua conta.', 'success', onlineId);\n        global.showNotification?.('Você entrou na Crônica online.');\n"""
          if old not in text:
            raise SystemExit('invite acceptance success anchor missing')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        run: node --check js/chronicles-sharing.js

      - name: Verify hardened states
        run: |
          grep -q "Versão Online Criada" js/chronicles-sharing.js
          grep -q "Capa, Elenco, Participantes, Confrontos e Escudo" js/chronicles-sharing.js
          grep -q "completedOnlineId" js/chronicles-sharing.js
          grep -q "Ver Crônicas" js/chronicles-sharing.js

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/chronicles-sharing.js
          git commit -m "Harden Chronicle sharing flows"
          git push origin HEAD:chronicles-sharing-foundation
