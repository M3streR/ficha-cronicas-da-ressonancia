name: Online chronicles integration patch

on:
  push:
    branches:
      - chronicles-online-foundation
    paths:
      - .github/workflows/chronicles-online-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chronicles-online-foundation

      - name: Patch index and script safely
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          css_anchor = '  <link rel="stylesheet" href="css/account-auth.css?v=1">\n'
          css_insert = css_anchor + '  <link rel="stylesheet" href="css/chronicles-online.css?v=1">\n'
          if 'css/chronicles-online.css' not in text:
            if css_anchor not in text: raise SystemExit('index css anchor missing')
            text = text.replace(css_anchor, css_insert, 1)
          js_anchor = '  <script src="js/chronicles-storage.js?v=6-combates-1"></script>\n'
          js_insert = js_anchor + '  <script src="js/chronicles-online.js?v=1"></script>\n'
          if 'js/chronicles-online.js' not in text:
            if js_anchor not in text: raise SystemExit('index js anchor missing')
            text = text.replace(js_anchor, js_insert, 1)
          index.write_text(text, encoding='utf-8')

          script = Path('script.js')
          text = script.read_text(encoding='utf-8')

          replacements = [
            (
              "function getChroniclesStorage() {\n  if (!window.ChroniclesStorage) throw new Error('CHRONICLES_STORAGE_UNAVAILABLE');\n  return window.ChroniclesStorage;\n}",
              "function getChroniclesStorage() {\n  if (!window.ChroniclesStorage) throw new Error('CHRONICLES_STORAGE_UNAVAILABLE');\n  return window.ChroniclesOnline?.createRouter(window.ChroniclesStorage) || window.ChroniclesStorage;\n}"
            ),
            (
              "  card.append(cover, copy, openButton);\n  return { card, coverImage, coverPlaceholder, openButton };",
              "  card.append(cover, copy, openButton);\n  window.ChroniclesOnline?.decorateRecord(card, metadata, chronicle);\n  return { card, coverImage, coverPlaceholder, openButton };"
            ),
            (
              "  populateChronicleOverview(chronicle);\n\n  const synopsis = document.getElementById('chronicleDetailSynopsis');",
              "  populateChronicleOverview(chronicle);\n  window.ChroniclesOnline?.applyDetailMode(chronicle);\n\n  const synopsis = document.getElementById('chronicleDetailSynopsis');"
            ),
            (
              "  setChronicleFormMode('create');\n\n  const preview = document.getElementById('chronicleCoverPreview');",
              "  setChronicleFormMode('create');\n  window.ChroniclesOnline?.setFormStorage('local');\n\n  const preview = document.getElementById('chronicleCoverPreview');"
            ),
            (
              "    chronicleFormOriginal = { ...chronicle };\n    chronicleFormVisualIndex = visualIndex;",
              "    chronicleFormOriginal = { ...chronicle };\n    window.ChroniclesOnline?.setFormStorage(chronicle.storage || 'local', { locked: true });\n    chronicleFormVisualIndex = visualIndex;"
            ),
            (
              "  return 'Não foi possível concluir a operação. Nenhuma alteração parcial foi salva. Tente novamente.';\n}",
              "  const onlineMessage = window.ChroniclesOnline?.getErrorMessage(error);\n  if (onlineMessage) return onlineMessage;\n  return 'Não foi possível concluir a operação. Nenhuma alteração parcial foi salva. Tente novamente.';\n}"
            )
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'script anchor missing: {old[:100]!r}')
            text = text.replace(old, new, 1)

          script.write_text(text, encoding='utf-8')
          PY

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js
          git commit -m "Integrate local and online chronicles"
          git push origin HEAD:chronicles-online-foundation
