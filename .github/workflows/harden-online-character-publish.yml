name: Harden online character publishing

on:
  push:
    branches:
      - online-participants-cast
    paths:
      - .github/workflows/harden-online-character-publish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: online-participants-cast

      - name: Force thumbnail-only publishing source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('script.js')
          text = path.read_text(encoding='utf-8')
          old = '''globalThis.ChroniclesLocalCharacters = Object.freeze({\n  list() {\n    const directory = getChronicleCharacterDirectory();\n    if (directory.unavailable) throw new Error('LOCAL_CHARACTER_DIRECTORY_UNAVAILABLE');\n    return directory.entries.map(entry => ({\n      ...entry,\n      character: readStoredCharacter(entry.id)\n    }));\n  }\n});'''
          new = '''globalThis.ChroniclesLocalCharacters = Object.freeze({\n  list() {\n    const directory = getChronicleCharacterDirectory();\n    if (directory.unavailable) throw new Error('LOCAL_CHARACTER_DIRECTORY_UNAVAILABLE');\n    const manager = readCharacterManager();\n    return directory.entries.map(entry => ({\n      ...entry,\n      thumbnail: manager?.characters?.[entry.id]?.thumbnail || '',\n      character: readStoredCharacter(entry.id)\n    }));\n  }\n});'''
          if old not in text:
            raise SystemExit('ChroniclesLocalCharacters block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check js/chronicles-collaboration.js

      - name: Verify privacy hardening
        run: |
          grep -q "thumbnail: manager?.characters?.\[entry.id\]?.thumbnail || ''" script.js

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Use thumbnail-only online character publishing"
          git push origin HEAD:online-participants-cast
