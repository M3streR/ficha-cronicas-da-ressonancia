name: Integrate Chronicle sharing

on:
  push:
    branches:
      - chronicles-sharing-foundation
    paths:
      - .github/workflows/chronicles-sharing-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chronicles-sharing-foundation

      - name: Patch sharing UI integration
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          css_anchor = '  <link rel="stylesheet" href="css/chronicles-online.css?v=1">\n'
          css_insert = css_anchor + '  <link rel="stylesheet" href="css/chronicles-sharing.css?v=1">\n'
          if 'css/chronicles-sharing.css' not in text:
            if css_anchor not in text:
              raise SystemExit('Chronicles online CSS anchor missing')
            text = text.replace(css_anchor, css_insert, 1)

          action_old = '''                    <button class="chronicle-context-action" id="editChronicleAction" type="button">Editar Crônica</button>\n                    <button class="chronicle-context-action master-shield" id="openMasterShield" type="button">Escudo do Mestre</button>\n                    <button class="chronicle-context-action" type="button" aria-describedby="chronicleActionsUnavailable" disabled>Convidar Participantes <small>Em breve</small></button>'''
          action_new = '''                    <button class="chronicle-context-action" id="editChronicleAction" type="button">Editar Crônica</button>\n                    <button class="chronicle-context-action master-shield" id="openMasterShield" type="button">Escudo do Mestre</button>\n                    <button class="chronicle-context-action" id="makeChronicleOnlineAction" type="button" hidden>Tornar Crônica Online</button>\n                    <button class="chronicle-context-action" id="inviteChronicleAction" type="button" hidden>Convidar Participantes</button>'''
          if 'id="makeChronicleOnlineAction"' not in text:
            if action_old not in text:
              raise SystemExit('Chronicle actions anchor missing')
            text = text.replace(action_old, action_new, 1)

          script_anchor = '  <script src="js/chronicles-online.js?v=1"></script>\n'
          script_insert = script_anchor + '  <script src="js/chronicles-sharing.js?v=1"></script>\n'
          if 'js/chronicles-sharing.js' not in text:
            if script_anchor not in text:
              raise SystemExit('Chronicles online JS anchor missing')
            text = text.replace(script_anchor, script_insert, 1)

          index.write_text(text, encoding='utf-8')

          online = Path('js/chronicles-online.js')
          text = online.read_text(encoding='utf-8')
          anchor = '''    if (edit) {\n      edit.disabled = online && !owner;\n      edit.title = online && !owner ? 'Somente o Mestre pode editar esta Crônica online.' : '';\n    }\n  }'''
          replacement = '''    if (edit) {\n      edit.disabled = online && !owner;\n      edit.title = online && !owner ? 'Somente o Mestre pode editar esta Crônica online.' : '';\n    }\n    global.ChroniclesSharing?.applyDetailMode(chronicle);\n  }'''
          if 'global.ChroniclesSharing?.applyDetailMode(chronicle);' not in text:
            if anchor not in text:
              raise SystemExit('applyDetailMode anchor missing')
            text = text.replace(anchor, replacement, 1)
          online.write_text(text, encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        run: |
          node --check js/chronicles-online.js
          node --check js/chronicles-sharing.js

      - name: Verify sharing integration
        run: |
          grep -q 'id="makeChronicleOnlineAction"' index.html
          grep -q 'id="inviteChronicleAction"' index.html
          grep -q 'js/chronicles-sharing.js' index.html
          grep -q 'css/chronicles-sharing.css' index.html
          grep -q 'ChroniclesSharing?.applyDetailMode' js/chronicles-online.js

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/chronicles-online.js
          git commit -m "Integrate Chronicle sharing actions"
          git push origin HEAD:chronicles-sharing-foundation
