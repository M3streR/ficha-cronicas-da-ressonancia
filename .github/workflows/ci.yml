name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar sintaxe JavaScript
        shell: bash
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check && node --check script.js
      - name: Executar testes de módulos
        run: node --test tests/online-chronicles.test.cjs tests/online-character-persistence.test.cjs tests/online-character-realtime.test.cjs tests/online-rolls.test.cjs tests/stabilization.test.cjs
      - name: Validar modelo de Encantamentos
        run: node --test tests/enchantments.test.cjs
      - name: Validar modelo Geração de Ouro
        run: node --test tests/gold-generation.test.cjs
      - name: Validar modelo dos dois olhos
        run: node --test tests/coyote-eyes.test.cjs
      - name: Instalar ferramenta de testes
        timeout-minutes: 3
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Instalar navegador de teste
        timeout-minutes: 5
        run: npx playwright install --with-deps --only-shell chromium
      - name: Disponibilizar dependências compartilhadas nos testes isolados do motor
        run: ln -s ../account-auth engine/account-auth && ln -s ../official-storage-backup.js engine/official-storage-backup.js
      - name: Executar fluxos reais por HTTP
        env:
          CHROME_PATH: ''
        run: |
          node engine/tests/character-storage.test.cjs
          node engine/tests/enchantments-ui.test.cjs
          node engine/tests/gold-generation-ui.test.cjs
          node engine/tests/coyote-eyes-ui.test.cjs
          node engine/tests/chronicles-v6.test.cjs
          node engine/tests/combates-flow.test.cjs
          node engine/tests/free-rolls.test.cjs
          node engine/tests/ux-stabilization.cjs
          node engine/tests/skills-progression.test.cjs
          node engine/tests/critical-states.test.cjs
          node engine/tests/conflict-resolution-ui.test.cjs
          node engine/tests/multi-tab-edit-authority.test.cjs
          node engine/tests/visual-audit.cjs
          node engine/tests/dynamic-layout-audit.cjs
          node engine/tests/layering-audit.cjs
      - name: Validar a interface 2.0 e a migração de acesso
        env:
          CANDIDATE_DIR: .
          OFFICIAL_SOURCE_ROOT: .
        run: node --test release-tests/*.test.cjs
