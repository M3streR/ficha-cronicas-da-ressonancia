name: Chronicle navigation hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-chronicle-navigation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply hotfix
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/encountersTab.disabled = online;/encountersTab.disabled = false;/" js/chronicles-online.js
          sed -i "s/encountersTab.title = online ? 'Confrontos online serão conectados na próxima etapa.' : '';/encountersTab.title = '';/" js/chronicles-online.js
          sed -i "s/masterShield.disabled = online;/masterShield.disabled = online \&\& !owner;/" js/chronicles-online.js
          sed -i "s/masterShield.title = online ? 'O Escudo online será ligado às permissões do Mestre em uma próxima etapa.' : '';/masterShield.title = online \&\& !owner ? 'Somente o Mestre pode abrir o Escudo desta Crônica online.' : '';/" js/chronicles-online.js
          sed -i 's/css\/chronicles-online.css?v=1/css\/chronicles-online.css?v=4/' index.html
          sed -i 's/css\/chronicles-sharing.css?v=1/css\/chronicles-sharing.css?v=4/' index.html
          sed -i 's/css\/chronicles-collaboration.css?v=1/css\/chronicles-collaboration.css?v=4/' index.html
          sed -i 's/js\/chronicles-online.js?v=1/js\/chronicles-online.js?v=4/' index.html
          sed -i 's/js\/chronicles-sharing.js?v=1/js\/chronicles-sharing.js?v=4/' index.html
          sed -i 's/js\/chronicles-collaboration.js?v=1/js\/chronicles-collaboration.js?v=4/' index.html
          sed -i 's/script.js?v=6-combates-1/script.js?v=6-combates-nav-4/' index.html
          node --check js/chronicles-online.js
          node --check js/chronicles-collaboration.js
          node --check script.js
          grep -q 'encountersTab.disabled = false' js/chronicles-online.js
          grep -q 'masterShield.disabled = online && !owner' js/chronicles-online.js
          grep -q 'js/chronicles-online.js?v=4' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/chronicles-online.js index.html
          git commit -m 'Unlock Chronicle navigation and bust stale cache'
          git push origin HEAD:main
