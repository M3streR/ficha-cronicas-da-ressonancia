name: Harden online cast navigation

on:
  push:
    branches:
      - online-participants-cast
    paths:
      - .github/workflows/harden-online-cast-navigation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: online-participants-cast

      - name: Close online cast manager when leaving Cast tab
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('script.js')
          text = path.read_text(encoding='utf-8')
          old = '''function setChronicleDetailSection(\n  sectionId,\n  { focusTab = false, skipCastGuard = false, skipCastRender = false } = {}\n) {\n  if (window.MasterShieldUI?.requestExit(() => setChronicleDetailSection(sectionId, { focusTab, skipCastGuard, skipCastRender }))) return;'''
          new = '''function setChronicleDetailSection(\n  sectionId,\n  { focusTab = false, skipCastGuard = false, skipCastRender = false } = {}\n) {\n  if (sectionId !== 'cast' && activeChronicleRecord?.storage === 'online') {\n    void window.ChroniclesCollaboration?.closeCastManager({ render: false });\n  }\n  if (window.MasterShieldUI?.requestExit(() => setChronicleDetailSection(sectionId, { focusTab, skipCastGuard, skipCastRender }))) return;'''
          if old not in text:
            raise SystemExit('setChronicleDetailSection anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Verify navigation guard
        run: grep -q "sectionId !== 'cast' && activeChronicleRecord?.storage === 'online'" script.js

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Close online cast manager on tab change"
          git push origin HEAD:online-participants-cast
