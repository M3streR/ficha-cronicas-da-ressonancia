name: Apply confrontation timestamp precision fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-confrontation-timestamp-precision.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python tools/fix_confrontation_timestamp_precision.py
      - run: |
          node --check js/chronicles-online-combat.js
          grep -q "updatedAt: row.updated_at || null" js/chronicles-online-combat.js
          grep -q "js/chronicles-online-combat.js?v=timestamp-precision-fix" index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/chronicles-online-combat.js index.html
          git commit -m "Preserve confrontation timestamp precision"
          git push origin HEAD:main
